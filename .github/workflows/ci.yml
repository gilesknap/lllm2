name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:  # Runs the GPU smoke test on any branch.

permissions:
  contents: read

jobs:
  lint:
    uses: ./.github/workflows/_tox.yml
    with:
      tox: pre-commit,type-checking
      helm: true

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Package versions come from Git tags.
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      # tests/test_helm_chart.py renders the chart.
      - uses: Azure/setup-helm@v5
        with:
          version: 3.17.1
      # It also runs the sign-in sidecar's rendered arguments through
      # oauth2-proxy --config-test. Keep VERSION equal to the chart's
      # ingress.oidc.image.tag: the test checks that they match.
      - name: Install oauth2-proxy
        env:
          VERSION: v7.15.5
          SHA256: f63f94bf72c5f46ab002a0a275aa8b3cf19b4d828aed08a13978cb9a62c3a1fd
        run: |
          set -eu
          name="oauth2-proxy-${VERSION}.linux-amd64"
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://github.com/oauth2-proxy/oauth2-proxy/releases/download/${VERSION}/${name}.tar.gz"
          echo "${SHA256}  ${name}.tar.gz" | sha256sum -c
          tar xzf "${name}.tar.gz" --no-same-owner
          echo "$RUNNER_TEMP/$name" >> "$GITHUB_PATH"
      - run: uv sync --locked
      - run: uv run --locked tox -e tests

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Chrome is preinstalled on the Ubuntu runner; the suite mocks the server.
      - run: node tests/test_ui_browser.cjs
        env:
          CHROME_BIN: google-chrome

  docs-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
      - run: uv sync --locked --group docs
      - run: uv run --locked tox -e docs
      - uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: build/html
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: build/html

  docs:
    needs: [lint, test, browser, docs-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deploy
        uses: actions/deploy-pages@v4

  dist:
    uses: ./.github/workflows/_dist.yml

  container:
    # Builds and tests the image on every run. It waits for engines, whose
    # CUDA 12 tarball goes into the image when no release has it yet, and
    # pushes main and tags only when the tests pass.
    needs: [test, engines]
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/_container.yml
    with:
      publish: ${{ github.event_name == 'push' && needs.test.result == 'success' }}
    permissions:
      contents: read
      packages: write
      actions: read

  helm:
    uses: ./.github/workflows/_helm.yml
    with:
      publish: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    permissions:
      contents: read
      packages: write

  engines:
    # Tags publish the engines. A llama.cpp bump PR or a manual run builds them
    # for the GPU smoke test; a pin that is already released is reused.
    if: >-
      (github.event_name == 'push' && github.ref_type == 'tag') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.head_ref == 'bot/llama-cpp-bump' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/_engines.yml
    permissions:
      contents: write

  modal-changes:
    # Says whether a pull request changes the code gpu-smoke covers (PATHS in
    # .github/scripts/modal_changes.py), so the paid test runs only then.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      modal: ${{ steps.diff.outputs.modal }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2  # The PR merged into its base, and both parents.
      - name: List the changes that gpu-smoke covers
        id: diff
        # HEAD is the PR merged into the tip of its base branch, HEAD^1.
        run: python3 .github/scripts/modal_changes.py HEAD^1 HEAD
      - name: Explain why a pull request from a fork skips gpu-smoke
        if: >-
          steps.diff.outputs.modal == 'true' &&
          github.event.pull_request.head.repo.full_name != github.repository
        run: echo "::notice::This PR changes Modal code, but gpu-smoke runs only for branches of this repository, as forks get no Modal secrets."

  gpu-smoke:
    # Real-GPU end-to-end test of the engine on Modal: download a model, serve
    # it on a T4, stream a completion and stop. It runs in the lllm2-ci Modal
    # environment, kept for CI, with the secrets of the GitHub environment
    # modal, and passes without touching Modal when they are absent.
    #
    # It runs on manual runs, on llama.cpp bump PRs and on other pull requests
    # from this repository that change Modal code (modal-changes). It tests the
    # engines this run built, or else the released engine for the pins. Pushes
    # to main do not run it: their PR already did, and a failure on main would
    # stop the bump release, which tags only a green main.
    needs: [engines, modal-changes]
    # !cancelled() lets it run when engines or modal-changes was skipped. When
    # either failed it runs only to fail, at the first step, as a skipped
    # required check counts as passed; "!= 'false'" covers modal-changes.
    if: >-
      !cancelled() &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        (github.head_ref == 'bot/llama-cpp-bump' ||
         needs.modal-changes.outputs.modal != 'false')))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # One run at a time: the sweep stops everything in the environment.
    concurrency:
      group: modal-lllm2-ci
      cancel-in-progress: false
    # Used only for its secrets, so no GitHub deployment is recorded.
    environment:
      name: modal
      deployment: false
    permissions:
      contents: read
      actions: read
    env:
      MODAL_ENVIRONMENT: lllm2-ci
      # The Modal client reads MODAL_TOKEN_SECRET; the secret is MODAL_SECRET.
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_SECRET }}
      HAS_MODAL: ${{ secrets.MODAL_TOKEN_ID != '' && secrets.MODAL_SECRET != '' }}
    steps:
      - name: Fail when a job this one needs failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        env:
          ENGINES: ${{ needs.engines.result }}
          CHANGES: ${{ needs.modal-changes.result }}
        run: |
          echo "::error::engines: $ENGINES, modal-changes: $CHANGES. The GPU smoke test did not run."
          exit 1
      - name: Skip without Modal credentials
        if: env.HAS_MODAL != 'true'
        run: echo "::notice::The modal environment has no MODAL_TOKEN_ID and MODAL_SECRET secrets, so the GPU smoke test did not run."
      - uses: actions/checkout@v5
        if: env.HAS_MODAL == 'true'
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        if: env.HAS_MODAL == 'true'
        with:
          python-version: '3.12'
      - name: Install lllm2 with the Modal client
        id: sync
        if: env.HAS_MODAL == 'true'
        run: uv sync --locked --extra modal
      - name: Check for engines built in this run
        id: engines
        if: env.HAS_MODAL == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          found=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/artifacts" --jq 'any(.artifacts[]; .name | startswith("engine-cuda"))')
          echo "found=$found" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v5
        if: steps.engines.outputs.found == 'true'
        with:
          pattern: engine-cuda*
          merge-multiple: true
          path: engine-dist
      - name: Install this run's engines in the Modal image
        if: steps.engines.outputs.found == 'true'
        run: echo "LLLM2_MODAL_ENGINE_DIR=$PWD/engine-dist" >> "$GITHUB_ENV"
      - name: Stop anything an earlier run left in the CI environment
        if: env.HAS_MODAL == 'true'
        run: uv run --locked --extra modal python .github/scripts/modal_sweep.py "$MODAL_ENVIRONMENT"
      - name: Download, serve and stream on a T4
        if: env.HAS_MODAL == 'true'
        timeout-minutes: 40
        env:
          LLLM2_MODAL_INTEGRATION: '1'
        run: uv run --locked --extra modal pytest tests/test_modal_integration.py -s
      - name: Check that lllm2 stopped its own containers
        if: env.HAS_MODAL == 'true'
        run: uv run --locked --extra modal python .github/scripts/modal_sweep.py "$MODAL_ENVIRONMENT" --check
      # Runs after failures, timeouts and cancellation too, once the Modal
      # client is installed. It fails the job if anything in the environment
      # is still running afterwards.
      - name: Stop every app and container in the CI environment
        if: ${{ always() && steps.sync.outcome == 'success' }}
        timeout-minutes: 5
        run: uv run --locked --extra modal python .github/scripts/modal_sweep.py "$MODAL_ENVIRONMENT"

  release:
    # A release waits for its image and chart, so PyPI never runs ahead of them.
    needs: [lint, test, browser, docs-build, dist, engines, container, helm]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: release-dist
      # The chart's values schema, for editors checking a values file.
      - uses: actions/download-artifact@v5
        with:
          name: helm-chart-schemas
          path: release-dist
      - name: Check for newly staged engines
        id: engines
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          found=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/artifacts" --jq 'any(.artifacts[]; .name | startswith("engine-cuda"))')
          echo "found=$found" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v5
        if: steps.engines.outputs.found == 'true'
        with:
          pattern: engine-cuda*
          merge-multiple: true
          path: release-dist
      - name: Publish distributions and any newly staged engines
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --json isDraft > release-state.json; then
            if python3 -c 'import json; raise SystemExit(not json.load(open("release-state.json"))["isDraft"])'; then
              gh release upload "$TAG" release-dist/* --clobber
              gh release edit "$TAG" --draft=false
            else
              echo "Release $TAG is already published; preserving its assets."
            fi
          else
            gh release create "$TAG" release-dist/* --verify-tag --generate-notes
          fi

  pypi:
    needs: [release]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    uses: ./.github/workflows/_pypi.yml
    permissions:
      id-token: write
