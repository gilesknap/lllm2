name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:  # Runs the GPU smoke test on any branch.

permissions:
  contents: read

jobs:
  lint:
    uses: ./.github/workflows/_tox.yml
    with:
      tox: pre-commit,type-checking

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Package versions come from Git tags.
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run --locked tox -e tests

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Chrome is preinstalled on the Ubuntu runner; the suite mocks the server.
      - run: node tests/test_ui_browser.cjs
        env:
          CHROME_BIN: google-chrome

  docs-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
      - run: uv sync --locked --group docs
      - run: uv run --locked tox -e docs
      - uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: build/html
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: build/html

  docs:
    needs: [lint, test, browser, docs-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deploy
        uses: actions/deploy-pages@v4

  dist:
    uses: ./.github/workflows/_dist.yml

  engines:
    # Tags publish the engines. A llama.cpp bump PR or a manual run builds them
    # for the GPU smoke test; a pin that is already released is reused.
    if: >-
      (github.event_name == 'push' && github.ref_type == 'tag') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.head_ref == 'bot/llama-cpp-bump' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/_engines.yml
    permissions:
      contents: write

  gpu-smoke:
    # Real-GPU end-to-end test of the engine on Modal: download a model, serve
    # it on a T4, stream a completion and stop. It runs in the lllm2-ci Modal
    # environment, kept for CI, and passes without touching Modal when the
    # MODAL_TOKEN_ID secret is absent (forks and contributors).
    needs: [engines]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.head_ref == 'bot/llama-cpp-bump' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # One run at a time: the sweep stops everything in the environment.
    concurrency:
      group: modal-lllm2-ci
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    env:
      MODAL_ENVIRONMENT: lllm2-ci
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      HAS_MODAL: ${{ secrets.MODAL_TOKEN_ID != '' }}
    steps:
      - name: Skip without Modal credentials
        if: env.HAS_MODAL != 'true'
        run: echo "::notice::MODAL_TOKEN_ID is not set, so the GPU smoke test did not run."
      - uses: actions/checkout@v5
        if: env.HAS_MODAL == 'true'
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        if: env.HAS_MODAL == 'true'
        with:
          python-version: '3.12'
      - if: env.HAS_MODAL == 'true'
        run: uv sync --locked --extra modal
      - name: Check for engines built in this run
        id: engines
        if: env.HAS_MODAL == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          found=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/artifacts" --jq 'any(.artifacts[]; .name | startswith("engine-cuda"))')
          echo "found=$found" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v5
        if: steps.engines.outputs.found == 'true'
        with:
          pattern: engine-cuda*
          merge-multiple: true
          path: engine-dist
      - name: Install this run's engines in the Modal image
        if: steps.engines.outputs.found == 'true'
        run: echo "LLLM2_MODAL_ENGINE_DIR=$PWD/engine-dist" >> "$GITHUB_ENV"
      - name: Stop anything an earlier run left in the CI environment
        if: env.HAS_MODAL == 'true'
        run: uv run --locked --extra modal python .github/scripts/modal_sweep.py "$MODAL_ENVIRONMENT"
      - name: Download, serve and stream on a T4
        if: env.HAS_MODAL == 'true'
        timeout-minutes: 40
        env:
          LLLM2_MODAL_INTEGRATION: '1'
        run: uv run --locked --extra modal pytest tests/test_modal_integration.py -s
      - name: Check that lllm2 stopped its own containers
        if: env.HAS_MODAL == 'true'
        run: uv run --locked --extra modal python .github/scripts/modal_sweep.py "$MODAL_ENVIRONMENT" --check
      # Runs after failures, timeouts and cancellation too. It fails the job if
      # anything in the environment is still running afterwards.
      - name: Stop every app and container in the CI environment
        if: ${{ always() && env.HAS_MODAL == 'true' }}
        timeout-minutes: 5
        run: uv run --locked --extra modal python .github/scripts/modal_sweep.py "$MODAL_ENVIRONMENT"

  release:
    needs: [lint, test, browser, docs-build, dist, engines]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: release-dist
      - name: Check for newly staged engines
        id: engines
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          found=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/artifacts" --jq 'any(.artifacts[]; .name | startswith("engine-cuda"))')
          echo "found=$found" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v5
        if: steps.engines.outputs.found == 'true'
        with:
          pattern: engine-cuda*
          merge-multiple: true
          path: release-dist
      - name: Publish distributions and any newly staged engines
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --json isDraft > release-state.json; then
            if python3 -c 'import json; raise SystemExit(not json.load(open("release-state.json"))["isDraft"])'; then
              gh release upload "$TAG" release-dist/* --clobber
              gh release edit "$TAG" --draft=false
            else
              echo "Release $TAG is already published; preserving its assets."
            fi
          else
            gh release create "$TAG" release-dist/* --verify-tag --generate-notes
          fi

  pypi:
    needs: [release]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    uses: ./.github/workflows/_pypi.yml
    permissions:
      id-token: write
