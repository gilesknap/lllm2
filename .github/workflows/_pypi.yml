name: Publish to PyPI

on:
  workflow_call:

jobs:
  upload:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist
      # Register _pypi.yml and the release environment as the trusted publisher.
      # Publish exactly the distributions checked by _dist.yml.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: false
