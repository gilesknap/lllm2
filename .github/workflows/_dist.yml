name: Build distributions

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
      - run: uv sync --locked
      # build produces the wheel from the sdist, checking both distributions.
      - name: Build sdist and wheel
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)
          uv run --locked python -m build
      - run: uv run --locked twine check --strict dist/*
      - name: Install and check the wheel outside the source import path
        run: |
          uv venv .venv-dist
          uv pip install --python .venv-dist/bin/python dist/*.whl
          .venv-dist/bin/python -I .github/scripts/check_dist.py
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
