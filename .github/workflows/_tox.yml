name: Run tox checks

on:
  workflow_call:
    inputs:
      tox:
        type: string
        description: Comma-separated tox environments
        required: true
      helm:
        type: boolean
        description: Install Helm and the schema plugin used by pre-commit
        default: false

permissions:
  contents: read

env:
  HELM_VERSION_TO_INSTALL: 3.17.1
  HELM_SCHEMA_PLUGIN_VERSION: v2.5.0

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install Helm
        if: inputs.helm
        uses: Azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION_TO_INSTALL }}
      - name: Install Helm schema plugin
        if: inputs.helm
        env:
          TAR_OPTIONS: --no-same-owner
        run: |
          helm plugin install https://github.com/losisin/helm-values-schema-json \
            --version "${HELM_SCHEMA_PLUGIN_VERSION}"
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run --locked tox -e "$TOX_ENVS"
        env:
          TOX_ENVS: ${{ inputs.tox }}
