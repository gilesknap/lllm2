[project]
name = "lllm2"
dynamic = ["version"]
description = "Local NVIDIA LLM experimentation workbench"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = ["typer>=0.16,<1"]

[project.scripts]
lllm2 = "lllm2.cli:main"

[project.urls]
GitHub = "https://github.com/gilesknap/lllm2"
Documentation = "https://gilesknap.github.io/lllm2/"

[dependency-groups]
dev = ["build>=1.2,<2", "twine>=6,<7", "hatch-vcs>=0.5,<1"]
docs = [
    "sphinx>=8,<9",
    "myst-parser>=4,<5",
    "pydata-sphinx-theme>=0.16,<0.17",
    "sphinx-copybutton>=0.5,<0.6",
]

[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.5,<1"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
# Keep metadata compatible with the release validator and PyPI upload tooling.
core-metadata-version = "2.4"
packages = ["lllm2"]

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
include = ["/lllm2", "/tests", "/docs", "/.github/scripts", "/README.md", "/LICENSE", "/NOTICE", "/pyproject.toml", "/uv.lock"]
